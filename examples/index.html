<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Exemple basique d'utilisation du code de manipulation GS1">
    <title>GS1 tester</title>
    <link rel="stylesheet" href="./assets/style.css" />
</head>

<body>

    <header>
        <h1>Test des QRCode GS1 DigitalLink</h1>
        <nav>
            <a
                href="https://boxinfo.apple.com/125787/01/00195951031026/21/HPQNJ76Q2J?8040=351927999506354&8041=351927997904288&8042=89043052010008887025036884863468">Exemple
                Apple</a>
        </nav>
    </header>

    <main>
        <div class="container">
            <!-- Colonne gauche : Formulaire -->
            <div class="column">
                <h2>📝 Test tes QRCode</h2>
                <div class="form-group">
                    <label for="name">QrCode (URL)</label>
                    <input type="text" name="gs1link" required />
                </div>

                <button id="parse">Parse</button>
                <button id="qrCodeGenerator">GS1 URL to QrCode</button>
                <button id="qrCodeScanner" style="display: none;">Scan from Webcam</button>
                <div class="center"><canvas id="qrcode"></canvas></div>
            </div>

            <!-- Colonne droite : Résultat -->
            <div class="column">
                <h2>👁️ Résultat</h2>
                <div id="result" class="result">
                    Soumettez le formulaire pour voir les données ici.
                </div>
            </div>
        </div>
        <div class="container" id="cameraContainer" style="display:none">
            <div class="column">
                <div id='cameraList'></div>
            </div>
            <div class="column">
                <video id="video" autoplay playsinline></video>
                <br>
                <button id="switchBtn">Switch Camera</button>
            </div>
        </div>
        <div class="container" id="qrcode_scanner">
            <div class="column">
                <div id="reader" style="width: 400px"></div>
            </div>
            <div class="column">
                <h2>👁️ Résultat du scan</h2>
                <div class="result">
                    Commencez à scanner
                </div>
            </div>
        </div>

    </main>

    <footer>
        &copy; 2026 Orange. Tous droits réservés.
    </footer>

    <script type="module">
        import { GS1DigitalLink } from '../src/GS1DigitalLink.js';

        var gs1;

        const dictionaryURL = "https://raw.githubusercontent.com/gs1/gs1-syntax-dictionary/2026-01-27/gs1-syntax-dictionary.txt";

        // désactivation de l'ihm de scan des QrCode
        document.getElementById("parse").setAttribute('disabled', "disabled");

        // Initialisation du parser de QRCode GS1
        GS1DigitalLink.fromGithubLastTag('gs1', 'gs1-syntax-dictionary', 'gs1-syntax-dictionary.txt')
            .then(gs1Result => {
                console.log('GS1 Parser Ready');

                gs1 = gs1Result;

                // A partir de maintenant on peut scanner les QrCodes
                // activation de l'ihm de scan des QrCode
                document.getElementById("parse").removeAttribute("disabled");

                // Example d'URL GS1 correct
                // https://example.com/01/09520123456788/10/LOT123/21/SERIAL456?17=261231&3103=000500

                // Example d'URL Apple Correct
                // https://boxinfo.apple.com/125787/01/00195951031026/21/HPQNJ76Q2J?8040=351927999506354&8041=351927997904288&8042=89043052010008887025036884863468 

                console.log(
                    gs1.parse("https://boxinfo.apple.com/125787/01/00195951031026/21/HPQNJ76Q2J?8040=351927999506354&8041=351927997904288&8042=89043052010008887025036884863468")
                );

                console.log(
                    gs1.build({
                        base: "https://boxinfo.apple.com/125787",
                        primaryKey: {
                            ai: "01",
                            value: "00195951031026"
                        },
                        qualifiers: [
                            {
                                ai: "21",
                                value: "HPQNJ76Q2J"
                            }
                        ],
                        dataAttributes: [
                            {
                                ai: "8040",
                                value: "326159487032615"
                            },
                            {
                                ai: "8041",
                                value: "123456789012345"
                            },
                            {
                                ai: "8042",
                                value: "98765432109876543210987654321098"
                            }
                        ],
                        extensions: [],
                        fragment: null,
                        canonical: false
                    })
                );
            });

        // Test GS1 parser
        window.addEventListener("load", function () {
            console.log('GS1 : Page loaded, now binding some events');
            document.getElementById("parse").onclick = function () {
                console.log('clicked');
                let url = document.getElementsByName('gs1link')[0].value;
                console.log(url);

                const parsed = gs1.parse(url);

                let htmlResult = "<p>Identifier " + parsed.primaryKey.definition.title + "(" + parsed.primaryKey.ai + ") avec comme valeur " + parsed.primaryKey.value + "</p>";
                for (const qualifier of parsed.qualifiers) {
                    htmlResult += "<p>Qualifier " + qualifier.definition.title + "(" + qualifier.ai + ") avec comme valeur " + qualifier.value + "</p>";
                }

                for (const dataAttribute of parsed.dataAttributes) {
                    htmlResult += "<p>Attribut " + dataAttribute.definition.title + "(" + dataAttribute.ai + ") avec comme valeur " + dataAttribute.value + "</p>";
                }

                document.getElementById('result').innerHTML = htmlResult;
                console.log(parsed.primaryKey);
                console.log(parsed.qualifiers);
                console.log(parsed.dataAttributes);
                console.log(parsed.extensions);
            };

            document.querySelector('nav a').onclick = function (event) {
                event.stopPropagation();
                event.preventDefault();
                document.getElementsByName('gs1link')[0].value = this.href;
            };
        });
    </script>
    <script type="module">
        import { Html5Qrcode, Html5QrcodeScanner, Html5QrcodeSupportedFormats } from 'html5-qrcode'

        var listeDecodedScan = [];

        window.addEventListener("load", function () {
            // test html5-qrcode
            function onScanSuccess(decodedText, decodedResult) {
                const resultContainer = document.querySelector('#qrcode_scanner .result');

                // Handle on success condition with the decoded text or result.
                console.log(`Scan result: ${decodedText}`, decodedResult);

                let identifier = window.btoa(decodedText);

                console.log(identifier);

                let index = listeDecodedScan.indexOf(identifier);
                if (index !== -1) {
                    let domElements = document.querySelectorAll("#qrcode_scanner span.counter");
                    let domElement = domElements[index];
                    domElement.innerText = parseInt(domElement.innerText) + 1;
                } else {
                    listeDecodedScan.push(identifier);
                    resultContainer.innerHTML += "<p>QrCode detecté <span class='counter'>1</span> fois " + decodedText + "</p>";
                    document.querySelector('input[name="gs1link"]').value = decodedText;
                    document.getElementById('parse').click();
                }
            }

            /*
            enum Html5QrcodeSupportedFormats {
                QR_CODE = 0,
                AZTEC,
                CODABAR,
                CODE_39,
                CODE_93,
                CODE_128,
                DATA_MATRIX,
                MAXICODE,
                ITF,
                EAN_13,
                EAN_8,
                PDF_417,
                RSS_14,
                RSS_EXPANDED,
                UPC_A,
                UPC_E,
                UPC_EAN_EXTENSION,
            }
            */

            const qrcodeScanner = new Html5QrcodeScanner(
                "reader", {
                fps: 15,
                qrbox: 250,
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.QR_CODE,
                    Html5QrcodeSupportedFormats.EAN_13
                ]
            }
            );
            qrcodeScanner.render(onScanSuccess);
        });
    </script>
    <!-- Transformation GS1 en QrCode -->
    <script type="module">
        import QRCode from "qrcode";

        window.addEventListener('load', function () {
            let qrCodeGeneratorButton = document.getElementById("qrCodeGenerator");
            if (!qrCodeGeneratorButton) {
                console.warn('Feature QrCode Generator not enabled.');
                return;
            }
            qrCodeGeneratorButton.addEventListener('click', function () {
                const text = document.getElementsByName("gs1link")[0].value.trim();
                console.log("Generating QrCode for ", text);

                // Input validation
                if (!text || ) {
                    alert("Please enter some text or a URL.");
                    return;
                }

                // Clear previous QR code
                let qrCodeContainer = document.getElementById("qrcode");
                qrCodeContainer.innerHTML = "";

                try {
                    QRCode.toCanvas(qrCodeContainer, text, function(error) {
                        if (error) console.error(error);
                        console.log('QrCode generated!');
                    });

                } catch (error) {
                    console.error("QR Code generation failed:", error);
                    alert("An error occurred while generating the QR code.");
                }
            });

        });
    </script>
</body>

</html>
